
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QRIS - ONIS FLL PRYMENT</title>
    <style>
        /* Reset & Variabel */
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #1a202c;
            --text-secondary: #4a5568;
            --accent-color: #4f46e5; /* Warna utama (ungu) */
            --accent-hover: #4338ca;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Utama */
        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 24px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.8;
            font-weight: 500;
        }

        /* Konten Utama */
        .content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Area QRIS */
        .qris-area {
            background-color: #f8fafc;
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .qris-area:hover {
            border-color: var(--accent-color);
            background-color: #eff6ff;
        }

        .qris-image-placeholder {
            width: 100%;
            max-width: 280px;
            height: 280px;
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin: 0 auto 16px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .qris-image-placeholder img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }

        .payment-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 12px;
        }

        .payment-info .label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
        }

        .payment-info .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Tombol Aksi */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-secondary {
            background-color: white;
            color: var(--text-main);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background-color: var(--bg-color);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Instruksi */
        .instructions {
            background-color: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 12px;
            padding: 16px;
            font-size: 0.85rem;
            color: #92400e;
            line-height: 1.6;
        }

        .instructions strong {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
        }

        /* Notifikasi Toast */
        #toast {
            visibility: hidden;
            min-width: 280px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 12px;
            padding: 16px;
            position: fixed;
            z-index: 10;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* Ikon SVG */
        .icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>ONIS FLL PRYMENT</h1>
            <p>Scan QRIS untuk melakukan pembayaran</p>
        </div>

        <!-- Konten -->
        <div class="content">
            
            <!-- Area QRIS -->
            <div class="qris-area">
                <div class="qris-image-placeholder">
                    <https://files.catbox.moe/7f85es.png>
